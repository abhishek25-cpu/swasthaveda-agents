[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swasthaveda-agents"
version = "0.1.0"
description = "Autonomous multi-agent marketing swarm for Swasthaveda Honey: Tracker, Predictor, Commander."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=0.40.0", "rich>=13.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
swasthaveda = "swasthaveda.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swasthaveda"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
